<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect x="0" y="0" width="1600" height="900" fill="#050906"/>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .t{font-family:'Inter Tight',sans-serif}
      .m{font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
      .lc{text-transform:none;letter-spacing:.02em}
    </style>
    <radialGradient id="glow" cx="42%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#0f1d11"/>
      <stop offset="100%" stop-color="#050906"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b968d"/>
    </marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7CFF4F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- header -->
  <text class="m" x="80" y="90" font-size="18" fill="#7CFF4F">[ ONE MODEL PER BANK ]</text>
  <text class="t" x="80" y="165" font-size="56" font-weight="400" letter-spacing="-1.5" fill="#eef3ec">Each client gets its own model.</text>
  <text class="t" x="80" y="210" font-size="22" fill="#8b968d">The bank's scorecard is in the system prompt, so Mubit treats each bank as its own task.</text>

  <!-- Redress -->
  <rect x="80" y="440" width="220" height="150" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text class="t" x="108" y="497" font-size="30" font-weight="500" fill="#eef3ec">Redress</text>
  <text class="t" x="108" y="530" font-size="19" fill="#8b968d">scores every</text>
  <text class="t" x="108" y="555" font-size="19" fill="#8b968d">regulated call</text>

  <!-- Redress to Mubit -->
  <path d="M 304 515 L 492 515" fill="none" stroke="#7CFF4F" stroke-width="2.5" marker-end="url(#ahl)"/>
  <text class="t" x="400" y="468" font-size="19" fill="#eef3ec" text-anchor="middle">every model call,</text>
  <text class="t" x="400" y="493" font-size="19" fill="#eef3ec" text-anchor="middle">one base URL</text>

  <!-- Mubit gateway -->
  <rect x="500" y="290" width="330" height="450" rx="18" fill="rgba(124,255,79,0.035)" stroke="#7CFF4F" stroke-opacity="0.6"/>
  <text class="m" x="528" y="336" font-size="22" font-weight="500" fill="#7CFF4F">Mubit</text>
  <text class="t" x="528" y="378" font-size="30" font-weight="500" fill="#eef3ec">LLM gateway</text>
  <text class="t" x="528" y="408" font-size="19" fill="#8b968d">speaks the OpenAI API</text>
  <line x1="528" y1="434" x2="802" y2="434" stroke="rgba(255,255,255,0.10)"/>
  <g class="t" font-size="20" fill="#eef3ec">
    <circle cx="536" cy="474" r="4" fill="#7CFF4F"/>
    <text class="t" x="552" y="481">records each call</text>
    <circle cx="536" cy="524" r="4" fill="#7CFF4F"/>
    <text class="t" x="552" y="531">groups calls into tasks</text>
    <circle cx="536" cy="574" r="4" fill="#7CFF4F"/>
    <text class="t" x="552" y="581">keeps good examples</text>
    <circle cx="536" cy="624" r="4" fill="#7CFF4F"/>
    <text class="t" x="552" y="631">trains an adapter per task</text>
    <circle cx="536" cy="674" r="4" fill="#7CFF4F"/>
    <text class="t" x="552" y="681">tests each version first</text>
  </g>

  <!-- Mubit to lanes -->
  <g fill="none" stroke="#8b968d" stroke-width="2.5" marker-end="url(#ahl)">
    <path d="M 834 400 C 880 400 890 380 928 380" stroke="#7CFF4F"/>
    <path d="M 834 630 C 880 630 890 668 928 668" stroke="#7CFF4F"/>
  </g>

  <!-- Thistle lane -->
  <rect x="905" y="258" width="615" height="222" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text class="t" x="937" y="302" font-size="26" font-weight="500" fill="#eef3ec">Thistle Bank</text>
  <text class="t" x="1488" y="302" font-size="19" fill="#8b968d" text-anchor="end">its own scorecard</text>
  <rect x="937" y="330" width="262" height="110" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
  <text class="m" x="961" y="368" font-size="18" fill="#8b968d">Task</text>
  <text class="m lc" x="961" y="410" font-size="20" fill="#eef3ec">review.thistle</text>
  <path d="M 1203 385 L 1236 385" fill="none" stroke="#8b968d" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="1242" y="330" width="246" height="110" rx="14" fill="rgba(124,255,79,0.05)" stroke="#7CFF4F" stroke-opacity="0.6"/>
  <text class="m" x="1266" y="368" font-size="18" fill="#7CFF4F">Adapter</text>
  <text class="t" x="1266" y="410" font-size="22" fill="#eef3ec">Thistle's model</text>

  <!-- divider -->
  <line x1="905" y1="515" x2="1520" y2="515" stroke="#ff7a6b" stroke-width="2" stroke-dasharray="10 8" stroke-opacity="0.8"/>
  <rect x="1000" y="498" width="425" height="34" fill="#050906"/>
  <text class="m" x="1212" y="522" font-size="18" fill="#ff7a6b" text-anchor="middle">Nothing crosses between banks</text>

  <!-- Northwind lane -->
  <rect x="905" y="550" width="615" height="222" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text class="t" x="937" y="594" font-size="26" font-weight="500" fill="#eef3ec">Northwind Finance</text>
  <text class="t" x="1488" y="594" font-size="19" fill="#8b968d" text-anchor="end">its own scorecard</text>
  <rect x="937" y="622" width="262" height="110" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
  <text class="m" x="961" y="660" font-size="18" fill="#8b968d">Task</text>
  <text class="m lc" x="961" y="702" font-size="20" fill="#eef3ec">review.northwind</text>
  <path d="M 1203 677 L 1236 677" fill="none" stroke="#8b968d" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="1242" y="622" width="246" height="110" rx="14" fill="rgba(124,255,79,0.05)" stroke="#7CFF4F" stroke-opacity="0.6"/>
  <text class="m" x="1266" y="660" font-size="18" fill="#7CFF4F">Adapter</text>
  <text class="t" x="1266" y="702" font-size="22" fill="#eef3ec">Northwind's model</text>

  <!-- note -->
  <text class="t" x="80" y="830" font-size="20" fill="#8b968d">Held-out test calls are recorded as metadata only, so they never train the model.</text>

  <!-- logo -->
  <g transform="translate(1380,856)">
    <circle cx="0" cy="-7" r="11" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="16" cy="-7" r="11" fill="none" stroke="#7CFF4F" stroke-width="3"/>
    <text class="t" x="38" y="0" font-size="20" font-weight="600"><tspan fill="#eef3ec">RE</tspan><tspan fill="#7CFF4F">DRESS</tspan></text>
  </g>
</svg>

<text class="t" x="970" y="454" font-size="22" font-weight="400" fill="#eef3ec" text-anchor="start" >Oh right. Don't worry, I'm sure</text>
<text class="t" x="970" y="490" font-size="22" font-weight="400" fill="#eef3ec" text-anchor="start" >we'll refund all of that for you.</text>
